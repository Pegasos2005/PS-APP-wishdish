<div class="principal-container">
  <header class="head">
    <button class="return-button" routerLink="/admin/crud-menu">&lt;</button>
    <img src="assets/logo.png" alt="logo">
  </header>

  <div class="body-admin">
    <div class="sub-header">Admin - Category Management</div>

    <main class="content-area">
      <div class="admin-toolbar">
        <input
          type="text"
          class="search-field"
          placeholder="🔍 Search categories..."
          (input)="searchTerm.set($any($event.target).value)"
        >
        <button class="add-btn" (click)="addNewCategory()">+ Add Category</button>
      </div>

      <div class="grid-comandas">
        @for (cat of filteredCategories(); track cat.id) {
        <section class="comanda-card">
          <div class="product-row">
            <span class="product-name"><strong>{{ cat.name }}</strong></span>
            <div class="product-controls">
              <div class="actions">
                <button class="btn-modify" (click)="editCategory(cat)">Modify</button>
                <button class="btn-delete" (click)="delete(cat.id)">Delete</button>
              </div>
            </div>
          </div>
        </section>
        }
      </div>
    </main>
  </div>
</div>

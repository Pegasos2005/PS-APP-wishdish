<div class="principal-container">
  <header class="head">
    <button class="return-button" routerLink="/admin/crud-menu">&lt;</button>
    <img src="assets/logo.png" alt="logo">
  </header>

  <div class="body-admin">
    <div class="sub-header">Admin - Product Management</div>

    <main class="content-area">
      <div class="admin-toolbar">
        <input
          type="text"
          class="search-field"
          placeholder="🔍 Search products..."
          (input)="searchTerm.set($any($event.target).value)"
        >
        <button class="add-btn" (click)="addNewProduct()">+ Add Product</button>
      </div>

      <div class="grid-comandas">
        @for (product of filteredProducts(); track product.id) {
        <section class="comanda-card">
          <div class="product-row">
            <div class="product-main-info">
              @if (product.picture) {
                <img [src]="product.picture" [alt]="product.name" class="product-thumbnail">
              } @else {
                <div class="product-thumbnail-placeholder">🍽️</div>
              }
              <span class="product-name">
                <strong>{{ product.name }}</strong>
                <span class="status-badge" [class.unavailable]="product.available === false">
                  {{ product.available !== false ? 'Disponible' : 'No disponible' }}
                </span>
              </span>
            </div>

            <div class="product-controls">
              <span class="product-price">{{ product.price | number:'1.2-2' }}€</span>
              <div class="actions">
                <button class="btn-toggle" (click)="toggleAvailability(product)">
                  {{ product.available !== false ? 'Deshabilitar' : 'Habilitar' }}
                </button>
                <button class="btn-modify" (click)="editProduct(product)">Modify</button>
                <button class="btn-delete" (click)="deleteProduct(product)">Delete</button>
              </div>
            </div>

          </div>
        </section>
        } @empty {
        <div class="empty-state">
          <p>No products found.</p>
        </div>
        }
      </div>
    </main>
  </div>
</div>
